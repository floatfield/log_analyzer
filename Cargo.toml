[package]
name = "log_analyzer"
version = "0.1.0"
edition = "2024"

# The merge utility (design D1); `src/main.rs` is the implicit GUI binary.
[[bin]]
name = "log-merge"
path = "src/bin/log_merge.rs"

[dependencies]
dirs = "6"
eframe = "0.33.3"
egui_extras = "0.33.3"
memmap2 = "0.9.11"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
